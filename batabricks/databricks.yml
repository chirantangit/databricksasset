# Declarative Automation Bundle configuration, more info here: https://docs.databricks.com/en/dev-tools/bundles/settings.html
bundle:
  name: "batabricks"

include:
  - resources/*.yml
  - resources/notebook/*.yml
  - resources/jobs/*.yml
  - resources/pipeline/*.yml

targets:
  # The 'dev' target, for development purposes. This target is the default.
  dev:
    mode: development
    default: true
    workspace:
      host: https://dbc-8cbeed4b-b80c.cloud.databricks.com
            # We always use /Users/das.chirantan@tcs.com for all resources to make sure we only have a single copy.
      root_path: /Users/das.chirantan@tcs.com/.bundle/${bundle.name}/${bundle.target}
    run_as:
      # This runs as das.chirantan@tcs.com in production. We could also use a service principal here,
      # see https://docs.databricks.com/dev-tools/bundles/permissions.html.
      user_name: das.chirantan@tcs.com

  # The 'prod' target, used for production deployment.
  prod:
    mode: production
    workspace:
      host: https://dbc-8cbeed4b-b80c.cloud.databricks.com
      # We always use /Users/das.chirantan@tcs.com for all resources to make sure we only have a single copy.
      root_path: /Users/das.chirantan@tcs.com/.bundle/${bundle.name}/${bundle.target}
    run_as:
      # This runs as das.chirantan@tcs.com in production. We could also use a service principal here,
      # see https://docs.databricks.com/dev-tools/bundles/permissions.html.
      user_name: das.chirantan@tcs.com
